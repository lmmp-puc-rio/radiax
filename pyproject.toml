[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "radiax"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "Gabriel S. Gerlero", email = "gerlero@lmmp.mec.puc-rio.br" }]
description = "Analytic polynomial roots with JAX"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = ["jax>=0.5,<0.12"]

[dependency-groups]
lint = ["ruff>=0.16.5,<0.17"]
typing = ["ty>=0.0.76,<0.1"]
test = [
    "numpy>=1,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]
dev = [
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "test"},
]

[project.urls]
Homepage = "https://github.com/lmmp-puc-rio/radiax"
Repository = "https://github.com/lmmp-puc-rio/radiax"
